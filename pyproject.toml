[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepx-python-sdk"
version = "0.2.1"
description = "Python SDK for the DeepX exchange chain — direct substrate extrinsics, async transaction engine, and REST API client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DeepX", email = "support@deepx.fi" },
]
keywords = ["deepx", "substrate", "perp", "dex", "trading", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "eth-account>=0.11.0,<1.0.0",
    "eth-abi>=4.0.0,<6.0.0",
    "eth-utils>=2.0.0,<7.0.0",
    "hexbytes>=0.3.1,<2.0.0",
    "scalecodec>=1.2.0,<2.0.0",
    "substrate-interface>=1.7.0,<2.0.0",
    "websockets>=11.0,<18.0",
    "python-socks>=2.0",
]

[project.urls]
Homepage = "https://github.com/deepxfinance/deepx-python-sdk"
Repository = "https://github.com/deepxfinance/deepx-python-sdk"
Issues = "https://github.com/deepxfinance/deepx-python-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepx_sdk*"]

[tool.setuptools.package-data]
deepx_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
branch = false
source = ["deepx_sdk"]
omit = [
    "tests/*",
    "src/deepx_sdk/_evm.py",
    "src/deepx_sdk/_native.py",
    "src/deepx_sdk/_native_py.py",
]

[tool.coverage.report]
fail_under = 99
precision = 2
show_missing = true
skip_covered = true
